[gcode_macro _set_logo_leds_off_inner]
gcode:
    SET_LED_EFFECT EFFECT=T{params.TOOL}_set_logo_leds STOP=1
    
[gcode_macro set_logo_leds_off]
gcode:
    {% if params.TOOL is defined %}
        _set_logo_leds_off_inner TOOL={params.TOOL}
    {% elif params.CURRENT_TOOL is defined %}
        {% set tn = printer.toolchanger.tool_number %}
        _set_logo_leds_off_inner TOOL={tn}
    {% else %}
      {% for tn in printer.toolchanger.tool_numbers %}
        _set_logo_leds_off_inner TOOL={tn}
      {% endfor %}
    {% endif %}

