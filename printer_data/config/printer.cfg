# Park front center
[gcode_macro PARKFRONT]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90                               ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z{printer.toolhead.axis_maximum.z/2} F6000        
    RESTORE_GCODE_STATE NAME=PARKFRONT
    
[gcode_macro PID_BED]
gcode:
      PID_CALIBRATE HEATER=heater_bed TARGET=110

[gcode_macro PID_NOZZLE0]
gcode:
      M106 S64
      PID_CALIBRATE HEATER=extruder TARGET=250

[gcode_macro PID_NOZZLE1]
gcode:
      M106 S64
      PID_CALIBRATE HEATER=extruder1 TARGET=250

[gcode_macro PID_NOZZLE2]
gcode:
      M106 S64
      PID_CALIBRATE HEATER=extruder2 TARGET=250

[gcode_macro PID_NOZZLE3]
gcode:
      M106 S64
      PID_CALIBRATE HEATER=extruder3 TARGET=250

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    #LOWERCURRENT
    G28
    #RESETCURRENT
   # G0 X175 Y175 Z30 F3600
    STATUS_READY
    
[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}

[gcode_macro PRINT_START]
gcode:
    STATUS_HOMING
    #LOWERCURRENT
    #SET_GCODE_OFFSET Z=0
    #RESETCURRENT
    M190 S{ params.BED }       ; Wait for bed to get to target temperature
    STATUS_READY
    G28
    QUAD_GANTRY_LEVEL
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1
    CARTOGRAPHER_TOUCH_HOME
    M117 Preheating nozzle
    M109 S150                  ; Wait for nozzle to heat to 150C - soften filament, but no oozing.
    M107                       ; Print fan off
    #G1 X175 Y175 Z50 F5000.0
    STATUS_HEATING 
    M117 Heating nozzle
    M109 S{ params.EXTRUDER }  ; Wait for nozzle to get to target temperature.
    G90                 ; Absolute coordinates.
    M83                 ; Relative extruder mode.
    STATUS_CLEANING
    #clean_nozzle
    STATUS_READY
    set_nozzle_leds_on
    #SET_FAN_SPEED FAN=Nevermore SPEED=0.7
    BED_MESH_PROFILE LOAD="default"    
    # G1 Z20 F3000                   ; move nozzle away from bed
    # G1 X10 Y20 Z0.3 F5000.0 ; move to start-line position
    # G1 X10 Y200.0 Z0.3 F1500.0 E15 ; draw 1st line
    # G1 X11 Y200.0 Z0.3 F5000.0 ; move to side a little
    # G1 X11 Y20 Z0.3 F1500.0 E30 ; draw 2nd line
    # G1 E27 F3000 ; retract filament 3mm
    # G92 E0 ; reset extruder
    # G1 Z1.0 F3000 ; move z up little to prevent scratching of surface
    LINE_PURGE

#[gcode_macro PRINT_START]
#gcode:
#    START_PRINT {rawparams}    
[gcode_macro PRINT_END]
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-4.0 F3600                 ; retract filament
    G91                            ; relative positioning

    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    #   Check end position to determine safe direction to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 2) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    G0 Z50 F3600             ; move nozzle up
    G0 X{x_safe} Y{y_safe} F20000  ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G90                            ; absolute positioning
#G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    G0 X60 Y{max_y-10} F3600          ; park nozzle at rear
    SET_PIN PIN=caselight VALUE=0.2
    BED_MESH_CLEAR
    STATUS_OFF
    
  # #[gcode_macro PRINT_END]
  # #   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
  # gcode:
  #   # safe anti-stringing move coords
  #   {% set th = printer.toolhead %}
  #   {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  #   {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
  #   {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
  #   SAVE_GCODE_STATE NAME=STATE_PRINT_END
  
  #   M400                           ; wait for buffer to clear
  #   G92 E0                         ; zero the extruder
  #   G1 E-12.0 F1800                 ; retract filament
    
  #   TURN_OFF_HEATERS
  #   M107
  #   G90                                      ; absolute positioning
  #   G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
  #   G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
  #   M107                                     ; turn off fan
  #   SET_PIN PIN=caselight VALUE=0
  #   BED_MESH_CLEAR
  #   STATUS_OFF
  #   # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
  #   # command pair is to restore the printer's coordinate system
  #   # and speed settings since the commands above change them.
  #   # However, to prevent any accidental, unintentional toolhead
  #   # moves when restoring the state, explicitly set MOVE=0.
  #   RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
    
