
[mcu EBBT0]
canbus_uuid:  a4e66a8c9a49 #547009892b57
# python3 ~/katapult/scripts/flashtool.py -i can0 -u ac5f7df1a805 -r
# python3 ~/katapult/scripts/flashtool.py -i can0 -u ac5f7df1a805 -f ~/klipper/out/klipper.bin

# [adxl345 T0]
# cs_pin: EBBT0: PB12
# spi_software_sclk_pin: EBBT0: PB10
# spi_software_mosi_pin: EBBT0: PB11
# spi_software_miso_pin: EBBT0: PB2
# axes_map: x,z,-y

[extruder]
step_pin: EBBT0: PD0
dir_pin: !EBBT0: PD1
enable_pin: !EBBT0: PD2
heater_pin: EBBT0: PB13
sensor_pin: EBBT0: PA3
sensor_type: ATC Semitec 104NT-4-R025H42G

full_steps_per_rotation: 200
gear_ratio: 50:8
microsteps: 16
rotation_distance: 27.2745 #20.67895
nozzle_diameter: 0.400
filament_diameter: 1.750

control: pid
pid_Kp: 22.094	
pid_Ki: 7.015	
pid_Kd: 45.929
min_temp: 0
max_temp: 300
max_extrude_cross_section: 20
max_extrude_only_distance: 150

[tmc2209 extruder]
uart_pin: EBBT0: PA15
run_current: 0.5
stealthchop_threshold: 0

[heater_fan T0_hotend_fan]
pin: EBBT0: PA0
heater: extruder
heater_temp: 50.0

[fan_generic T0_partfan]
pin: EBBT0: PA1


[tool T0]
tool_number: 0
detection_pin: ^EBBT0:PB9
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
extruder: extruder
fan: T0_partfan
#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 345
params_park_y: 4
params_park_z: 301
# params_park_x: 0
# params_park_y: 7
# params_park_z: 298
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 50.5
params_input_shaper_damping_ratio_x: 0.065
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 37.6
params_input_shaper_damping_ratio_y: 0.072

# [tool_probe_endstop]
# crash_mintime: 0.5 # seconds to wait before announcing a crash, if the probe stops 
#   #triggering before this, no crash is reported. 
# crash_gcode:
#     RESPOND TYPE=error MSG='Tool not detected, expected {printer.toolchanger.tool_number}. Pausing the print.' 
#     M84
#     TURN_OFF_HEATERS

