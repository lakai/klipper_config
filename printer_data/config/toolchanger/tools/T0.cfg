variable_logo_idx:              "1"
variable_logo_brightness:       "1"
variable_nozzle_led_name:       "T0_leds"
variable_nozzle_idx:            "2,3"
gcode:

[temperature_sensor EBBT0]
sensor_type: temperature_mcu
sensor_mcu:  EBBT0

[gcode_macro T0]
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=0
