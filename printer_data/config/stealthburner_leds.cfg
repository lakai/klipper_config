
[gcode_macro WLED_ON]
description: Turn WLED strip on using optional preset and resets led colors
gcode:
  {% set strip = params.STRIP|string %}
  {% set preset = params.PRESET|default(-1)|int %}

  {action_call_remote_method("set_wled_state",
                             strip=strip,
                             state=True,
                             preset=preset)}

[gcode_macro WLED_CONTROL]
description: Control effect values and brightness
gcode:
  {% set strip = params.STRIP|default('lights')|string %}
  {% set brightness = params.BRIGHTNESS|default(-1)|int %}
  {% set intensity = params.INTENSITY|default(-1)|int %}
  {% set speed = params.SPEED|default(-1)|int %}

  {action_call_remote_method("set_wled_state",
                             strip=strip,
                             brightness=brightness,
                             intensity=intensity,
                             speed=speed)}

[gcode_macro WLED_OFF]
description: Turn WLED strip off
gcode:
  {% set strip = params.STRIP|string %}

  {action_call_remote_method("set_wled_state",
                             strip=strip,
                             state=False)}

[gcode_macro SET_WLED]
description: SET_LED like functionality for WLED, applies to all active segments
gcode:
    {% set strip = params.STRIP|string %}
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set index = params.INDEX|default(-1)|int %}
    {% set transmit = params.TRANSMIT|default(1)|int %}

    {action_call_remote_method("set_wled",
                               strip=strip,
                               red=red, green=green, blue=blue, white=white,
                               index=index, transmit=transmit)}
                               
[neopixel sb_leds]
pin: PB0
chain_count: 57
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0
  
  # [neopixel sb_leds]
  # pin: ebb36:PD3
  # chain_count: 3
  # color_order: GRB,RGB,RGB
  # #   Set the pixel order required by the LED hardware. Options are GRB,
  # #   RGB, GRBW, or RGBW. The default is GRB.
  # initial_RED: 0.0
  # initial_GREEN: 0.0
  # initial_BLUE: 1.0
  # initial_WHITE: 0.0
[led_effect light_start]
autostart: true
	#recalculate:false
frame_rate: 24
leds:
	    neopixel:sb_leds
layers:
	    breathing 10 1 top (.5, .5, 1)

[led_effect progress_bar]
leds:
    neopixel:sb_leds
autostart:                          true
frame_rate:                         24
layers:
    progress  -1  0 add         ( 0, 0,   1),( 0, 0.1, 0.6)
    static     0  0 top         ( 0, 0, 0.1)
    
[led_effect sb_logo_busy]
autostart:              false
frame_rate:             24
leds:
    neopixel:sb_leds 
layers:
    breathing  3 1 top (1,0,0)

[led_effect sb_logo_cleaning]
autostart:              false
frame_rate:             24
leds:
    neopixel:sb_leds 
layers:
    breathing  3 1 top (0.0, 0.02, 0.5)

[led_effect sb_logo_calibrating_z]
autostart:              false
frame_rate:             24
leds:
    neopixel:sb_leds 
layers:
        breathing  3 1 top (0.0, 0.0, 0.35)

[led_effect sb_logo_heating]
leds:
    neopixel:sb_leds 
autostart:                          false
frame_rate:                         24
layers:
    strobe 8.00 3.00 top (1,0.18,0) 
    strobe 1.00 0.50 multiply (1.00,0.00,0.00) 
    static 0.00 0.00 divide (1.00,1.00,1.00) 
#heater:                 extruder
#layers:
#    strobe 1.00 0.50 multiply (1.00,0.00,0.00) 
 #   static 0.00 0.00 divide (1.00,1.00,1.00) 
  #  temperature 170 200 top (0.00,0.00,0.00),(1.00,1.00,1.00),(0.00,0.00,0.00) 

[led_effect sb_logo_cooling]
leds:
    neopixel:sb_leds 
autostart:                          false
frame_rate:                         24
layers:
     breathing  3 1 top (0, 0, 1)

[led_effect sb_logo_homing]
autostart:              false
frame_rate:             24
leds:
    neopixel:sb_leds 
endstops: x, y, probe
layers:
    breathing 5.00 1.00 add (0.00,0.50,1.00) 
    homing 1.20 0.00 add (1.0,1.0,1.0) 
 

[led_effect sb_logo_leveling]
autostart:              false
frame_rate:             24
leds:
    neopixel:sb_leds 
layers:
        breathing  3 1 top (0.5, 0.1, 0.4)

[led_effect sb_logo_meshing]
autostart:              false
frame_rate:             24
leds:
    neopixel:sb_leds 
layers:
        breathing  3 1 top (0.2, 1.0, 0.0)

[led_effect sb_logo_printing]
autostart:              false
frame_rate:             24
leds:
    neopixel:sb_leds 
layers:
    gradient  0.3  1 add (0.3, 0.0, 0.0),(0.3, 0.3, 0.0),(0.3, 0.1, 0.0)

[led_effect sb_logo_standby]
autostart:              false
frame_rate:             24
leds:
    neopixel:sb_leds 
layers:
        breathing  3 1 top (0.01, 0.01, 0.01)

[led_effect sb_logo_part_ready]
autostart:              false
frame_rate:             24
leds:
    neopixel:sb_leds 
layers:
        breathing  3 1 top (0.0, 1.0, 0.0)

